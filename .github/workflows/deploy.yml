# ──────────────────────────────────────────────────────────────────────────────
#  HRM Software — CI Pipeline
#  Triggers on push to `main`.
#
#  Jobs:
#   1. test  – Validate TypeScript types + lint
#
#  Note: Deployment is handled by Hostinger's Git integration / Webhook.
# ──────────────────────────────────────────────────────────────────────────────

name: 🔍 CI — Type Check & Lint

on:
  push:
    branches:
      - main
  workflow_dispatch:        # Allow manual trigger from GitHub Actions UI

# Cancel any in-flight run for the same branch (prevents queue pile-up)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

# ──────────────────────────────────────────────────────────────────────────────
# JOB 1 — TYPE CHECK & LINT
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  test:
    name: 🔍 Type Check & Lint
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📥 Install dependencies
        run: npm install

      - name: 🔬 Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://ci:ci@127.0.0.1:3306/ci_dummy"

      - name: ✅ TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: true   # Non-blocking — pre-existing errors won't fail the pipeline

      - name: 🧹 ESLint
        run: npx eslint . --max-warnings=50 --ext .ts,.tsx
        continue-on-error: true

# ──────────────────────────────────────────────────────────────────────────────
# JOB 2 — DEPLOY LIVE VIA COOLIFY
# ──────────────────────────────────────────────────────────────────────────────
# ⚠️ IMPORTANT SETUP INSTRUCTIONS:
# Go to your GitHub Repository -> Settings -> Secrets and variables -> Actions
# Click "New repository secret" and add:
# 1. Name: COOLIFY_TOKEN (Value: Your Coolify API Token)
# 2. Name: COOLIFY_WEBHOOK_URL (Value: Your Coolify deployment webhook URL)
  deploy_live:
    name: 🚀 Deploy to Coolify
    runs-on: ubuntu-latest
    needs: test
    # Ensure this strictly only runs on the main branch
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 🚀 Trigger Coolify Deployment
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "Error: COOLIFY_WEBHOOK_URL is missing!"
            exit 1
          fi
          echo "Triggering deployment on Coolify..."
          curl -v -X GET "$COOLIFY_WEBHOOK_URL" \
               -H "Authorization: Bearer $COOLIFY_TOKEN"
