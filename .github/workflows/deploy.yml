name: Deploy HRM to Coolify

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Deployment
        run: |
          set -euo pipefail

          if [ -z "${COOLIFY_TOKEN:-}" ]; then
            echo "Error: COOLIFY_TOKEN is missing!"
            exit 1
          fi

          APP_UUID="ft1pc1ordmv3cjlbqt6k79hw"
          COOLIFY_BASE_URL="https://host.fixanyphoto.com"
          
          # টোকেন থেকে হিডেন ক্যারেক্টার ক্লিন করা
          CLEAN_TOKEN=$(echo -n "${COOLIFY_TOKEN}" | tr -d '\n\r')

          echo "Triggering deployment on Coolify..."
          
          # '-d ""' যোগ করা হয়েছে এবং কানেকশন টাইমআউট (10s) সেট করা হয়েছে
          RESP=$(curl -v -sS -X POST \
            -H "Authorization: Bearer ${CLEAN_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --max-time 10 \
            -d "" \
            "${COOLIFY_BASE_URL}/api/v1/applications/${APP_UUID}/start")

          echo "Coolify response: ${RESP}"

          if ! echo "${RESP}" | grep -q "deployment_uuid"; then
            echo "Error: deployment trigger failed"
            exit 1
          fi
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}