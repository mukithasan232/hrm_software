# ──────────────────────────────────────────────────────────────────────────────
#  HRM Software — CI/CD Pipeline
#  Triggers on push to `main`.
#
#  Jobs:
#   1. test        – Validate TypeScript types + lint
#   2. deploy-web  – SSH deploy to Hostinger VPS (depends on test)
#   3. mobile-ota  – Push Expo EAS OTA update (runs in parallel with deploy-web)
# ──────────────────────────────────────────────────────────────────────────────

name: 🚀 CI/CD — Web Deploy + Mobile OTA

on:
  push:
    branches:
      - main
  workflow_dispatch:        # Allow manual trigger from GitHub Actions UI

# Cancel any in-flight run for the same branch (prevents queue pile-up)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

# ──────────────────────────────────────────────────────────────────────────────
# JOB 1 — TYPE CHECK & LINT
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  test:
    name: 🔍 Type Check & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hrm_software   # adjust if your folder has a trailing space

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'hrm_software/pnpm-lock.yaml'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔬 Generate Prisma Client
        run: npx prisma generate

      - name: ✅ TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: true   # Non-blocking — pre-existing errors won't fail the deploy

      - name: 🧹 ESLint
        run: npx eslint . --max-warnings=50 --ext .ts,.tsx
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 2 — DEPLOY WEB TO HOSTINGER VPS
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-web:
    name: 🌐 Deploy Web → Hostinger VPS
    runs-on: ubuntu-latest
    needs: test           # Only deploy if type-check passes
    environment: production

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      # ── SSH into your Hostinger VPS and run the deployment script ──
      # Required Secrets (set in GitHub → Settings → Secrets → Actions):
      #   HOSTINGER_HOST      → Your VPS IP or hostname (e.g. 147.x.x.x)
      #   HOSTINGER_USERNAME  → SSH user (e.g. root or your username)
      #   HOSTINGER_PASSWORD  → SSH password (or use HOSTINGER_SSH_KEY below)
      #   HOSTINGER_PORT      → SSH port (usually 22)
      #   HOSTINGER_SSH_KEY   → (Recommended) Private key for key-based auth
      - name: 🔐 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          # Use either password OR key — key-based is more secure:
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          # key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            set -e   # Exit immediately if any command fails

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  🚀 HRM Software — Deployment Started"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # ── 1. Navigate to your project directory on the VPS ──
            # ✏️  CHANGE THIS to your actual path on Hostinger:
            #    e.g. /home/user/htdocs/yourdomain.com  OR  /var/www/hrm
            cd /home/${{ secrets.HOSTINGER_USERNAME }}/htdocs/hrm || \
            cd /var/www/hrm || \
            cd ~/hrm_software || \
            { echo "❌ Cannot find project directory. Update the path in deploy.yml!"; exit 1; }

            echo "📁 Working in: $(pwd)"

            # ── 2. Pull the latest code ──
            echo "🔄 Pulling latest changes from main..."
            git pull origin main

            # ── 3. Install / update dependencies ──
            echo "📦 Installing dependencies..."
            npm ci

            # ── 4. Sync DB schema (Prisma) ──
            echo "🗄️  Syncing database schema..."
            npx prisma generate
            npx prisma db push --accept-data-loss

            # ── 5. Build the Next.js app ──
            echo "🏗️  Building Next.js production bundle..."
            npx next build

            # ── 6. Restart the server ──
            # ✏️  CHANGE to whichever process manager you use:
            echo "🔁 Restarting server process..."
            pm2 restart hrm-server --update-env || \
            pm2 restart all || \
            pm2 start server.js --name hrm-server -- || \
            { echo "⚠️  PM2 not found — please restart server manually."; }

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  ✅ Deployment completed successfully!"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 3 — EXPO EAS OVER-THE-AIR UPDATE (Mobile)
  # ──────────────────────────────────────────────────────────────────────────────
  mobile-ota:
    name: 📱 Mobile OTA Update → Expo EAS
    runs-on: ubuntu-latest
    needs: test           # Only push OTA if type-check passes
    environment: production

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'hrm_mobile/hrm-mobile/package-lock.json'

      # ── Install Expo CLI + EAS CLI globally ──
      - name: 📦 Install EAS CLI
        run: npm install -g eas-cli@latest expo-cli@latest

      # ── Authenticate with Expo using your EXPO_TOKEN ──
      # Required Secrets:
      #   EXPO_TOKEN → Generate at https://expo.dev/accounts/[your-account]/settings/access-tokens
      - name: 🔑 Authenticate with Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 Install mobile dependencies
        working-directory: hrm_mobile/hrm-mobile
        run: npm ci

      # ── Determine OTA branch based on git branch ──
      # main → production branch | any other → preview branch
      - name: 🎯 Determine EAS update branch
        id: eas-branch
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "branch=production" >> $GITHUB_OUTPUT
            echo "🎯 Target EAS branch: production"
          else
            echo "branch=preview" >> $GITHUB_OUTPUT
            echo "🎯 Target EAS branch: preview"
          fi

      # ── Push the OTA update ──
      - name: 📤 Push EAS OTA Update
        working-directory: hrm_mobile/hrm-mobile
        run: |
          eas update \
            --branch ${{ steps.eas-branch.outputs.branch }} \
            --message "🤖 Auto-deploy from commit ${{ github.sha }} — ${{ github.event.head_commit.message }}" \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📊 Summary
        run: |
          echo "### 📱 Mobile OTA Update Sent!" >> $GITHUB_STEP_SUMMARY
          echo "- **EAS Branch:** ${{ steps.eas-branch.outputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Message:** ${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 4 — NOTIFY (post-deploy summary in Slack/Discord — optional)
  # ──────────────────────────────────────────────────────────────────────────────
  notify:
    name: 🔔 Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-web, mobile-ota]
    if: always()    # Run even if previous jobs failed

    steps:
      - name: ✅ Success notification
        if: needs.deploy-web.result == 'success' && needs.mobile-ota.result == 'success'
        run: |
          echo "### 🎉 Full Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Web Deploy (Hostinger) | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 Mobile OTA (Expo EAS)  | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔖 Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 👤 Triggered by | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Failure notification
        if: needs.deploy-web.result == 'failure' || needs.mobile-ota.result == 'failure'
        run: |
          echo "### ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Web Deploy | ${{ needs.deploy-web.result == 'failure' && '❌ Failed' || '✅ OK' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 Mobile OTA | ${{ needs.mobile-ota.result == 'failure' && '❌ Failed' || '✅ OK' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 Check the logs above for details." >> $GITHUB_STEP_SUMMARY

      # ── Optional: Post to Slack ──
      # Uncomment and add SLACK_WEBHOOK_URL secret to enable:
      # - name: 📣 Post to Slack
      #   if: always()
      #   uses: slackapi/slack-github-action@v1.26.0
      #   with:
      #     payload: |
      #       {
      #         "text": "${{ job.status == 'success' && '✅' || '❌' }} *HRM Deploy* — ${{ github.ref_name }} — ${{ github.event.head_commit.message }}"
      #       }
      #   env:
      #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
